<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daby: Inglês LEGO - Dominando o Present Perfect</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel (for JSX in-browser) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      scroll-behavior: smooth;
    }
    #root {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }
    .verb-list {
      list-style: none;
      padding: 0;
    }
    .verb-list li {
      position: relative;
      padding-left: 1.5em;
      margin-bottom: 0.5em;
    }
    .verb-list li::before {
      content: '✅';
      position: absolute;
      left: 0;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const lessons = [
      // 1) Eu trabalhei (hoje, com relevância).
      {
        id: 1,
        bp: "Eu trabalhei (hoje, com relevância).",
        title: "Present Perfect vs. Simple Past (Relevância)",
        variations: {
          essential: "I have worked.",
          polite: "I have already concluded my tasks.",
          native: "I've gotten that done.",
        },
        steps: [
          {
            bp: "Eu trabalhei.",
            literal: "I worked.",
            correct: "I have worked.",
            catch:
              "🚨 **O CATCH:** Professor aqui! A diferença é crucial. Quando você diz **'I worked.'** (Passado Simples), é um fato que já acabou e não tem mais conexão com o presente. Pense: 'Trabalhei ontem e pronto.' Já **'I have worked.'** (Present Perfect) significa que a ação terminou, mas **o resultado ou a experiência ainda são relevantes AGORA**. Por exemplo: 'Trabalhei muito hoje, por isso estou cansado.' O foco é no impacto atual!",
          },
          {
            bp: "Eu trabalhei ontem.",
            literal: "I have worked yesterday.",
            correct: "I worked yesterday.",
            catch:
              "🚨 **O CATCH:** Atenção! Se você usa um **marcador de tempo específico e já terminado** como 'yesterday', 'last week', 'in 1999', 'two hours ago', você **SEMPRE** deve usar o **Passado Simples** ('I worked'). O Present Perfect não combina com tempo fechado no passado. É uma regra de ouro!",
          },
        ],
      },

      // 2) Eu trabalhei muito hoje.
      {
        id: 2,
        bp: "Eu trabalhei muito hoje.",
        title: "Reforçando com 'Muito' (A Lot) em Tempo Inacabado",
        variations: {
          essential: "I have worked very hard today.",
          polite: "I have dedicated a significant amount of effort today.",
          native: "I've worked my butt off today.",
        },
        steps: [
          {
            bp: "Eu trabalhei muito",
            literal: "I worked much",
            correct: "I have worked hard",
            catch:
              "🚨 **O CATCH:** Em inglês, quase nunca dizemos **'I worked much.'**; o nativo diz **'I worked a lot'** ou **'I have worked hard.'** Quando o período de tempo **ainda não acabou** (**'today'**, 'this week', 'this month'), o Present Perfect é muito usado: **I have worked hard today.**",
          },
          {
            bp: "hoje.",
            literal: "in today.",
            correct: "today.",
            catch:
              "🚨 **O CATCH:** **'Today'** é um período **incompleto** (o dia ainda não terminou). Por isso, se conecta com o presente e combina bem com Present Perfect: **I have worked hard today.** Se fosse 'yesterday', aí sim o natural seria **I worked yesterday.**",
          },
        ],
      },

      // 3) Eu verifiquei o relatório.
      {
        id: 3,
        bp: "Eu verifiquei o relatório.",
        title: "Ênfase no Resultado (Eu Verifiquei)",
        variations: {
          essential: "I have verified the report.",
          polite: "I have already completed the verification of the document.",
          native: "I've checked the report.",
        },
        steps: [
          {
            bp: "Eu verifiquei",
            literal: "I verified",
            correct: "I have verified",
            catch:
              "🚨 **O CATCH:** Quando o foco é que **o resultado é importante AGORA** (o relatório está verificado), o nativo prefere **Present Perfect**: **I have verified the report.** Sem tempo específico, isso passa a ideia de 'pronto agora'. **I verified the report** aparece mais quando você inclui um tempo passado bem definido, tipo 'I verified the report this morning.'",
          },
          // Bloco 2 removido conforme pedido
        ],
      },

      // 4) Já vi esse filme antes.
      {
        id: 4,
        bp: "Já vi esse filme antes.",
        title: "Experiência de Vida (Usando 'Already' e 'Before')",
        variations: {
          essential: "I have already seen this movie.",
          polite: "I have viewed this film on a previous occasion.",
          native: "Yeah, I've seen this one.",
        },
        steps: [
          {
            bp: "Já vi",
            literal: "Already I saw",
            correct: "I have already seen",
            catch:
              "🚨 **O CATCH:** Para falar de **experiência de vida até hoje**, inglês adora Present Perfect com **already/ever/never**. A ordem natural é: **I have already seen...** ou **I have seen... already.** Não diga 'Already I saw', porque a ordem parece muito tradução literal do português.",
          },
          // Bloco 2 removido conforme pedido
        ],
      },

      // 5) Eu trabalhei no Google.
      {
        id: 5,
        bp: "Eu trabalhei no Google.",
        title: "Trabalho ou Carreira (Relevância Atual)",
        variations: {
          essential: "I have worked at Google.",
          polite: "I have experience working at Google.",
          native: "I worked at Google.",
        },
        steps: [
          {
            bp: "Eu trabalhei no Google.",
            literal: "I worked at Google.",
            correct: "I have worked at Google.",
            catch:
              "🚨 **O CATCH:** Em entrevista, networking, currículo, o foco é **a experiência que você carrega hoje**. Aí, o Present Perfect funciona muito bem: **I have worked at Google.** Se você fala de um emprego fechado no passado, com ano ou período definido, pode usar **Simple Past**: **I worked at Google in 2018.**",
          },
          // Bloco 2 removido conforme pedido
        ],
      },

      // 6) Você já conheceu George?
      {
        id: 6,
        bp: "Você já conheceu George?",
        title: "Perguntando Sobre Experiências de Vida (Ever)",
        variations: {
          essential: "Have you ever met George?",
          polite: "Have you had the opportunity to meet George?",
          native: "Ya ever met George?",
        },
        steps: [
          {
            bp: "Você já",
            literal: "Did you already",
            correct: "Have you ever",
            catch:
              "🚨 **O CATCH:** Para **'Você já... alguma vez na vida?'**, a forma padrão é **Have you ever...?** O **ever** abre esse espaço de 'em qualquer momento até hoje'. 'Did you already...?' normalmente fala de algo mais específico, tipo hoje ou num período curto, não de experiência de vida aberta.",
          },
          {
            bp: "conheceu George?",
            literal: "to meet George?",
            correct: "met George?",
            catch:
              "🚨 **O CATCH:** Em **Have you ever met George?**, o verbo principal vem na **3ª coluna**: **met** (particípio de *meet*). O 'to meet George?' na sua cabeça é o infinitivo; na frase real, depois de **have you ever**, você precisa do particípio: **met George?**",
          },
        ],
      },

      // 7) Como era o evento?
      {
        id: 7,
        bp: "Como era o evento?",
        title: "Exceção: Pergunta sobre Descrição/Estado (Passado Simples)",
        variations: {
          essential: "What was the event like?",
          polite: "Could you please describe the nature of the event?",
          native: "How was the event?",
        },
        steps: [
          {
            bp: "Como era?",
            literal: "How was it?",
            correct: "What was it like?",
            catch:
              "🚨 **O CATCH:** Quando você quer descrição (clima, sensação, qualidade), **What was it like?** força a pessoa a descrever. **How was it?** também é ok, mas pode gerar respostas mais curtas ('It was good'). **What was it like?** puxa mais detalhes.",
          },
          {
            bp: "use 'it' no final",
            literal: "use 'it' at the end.",
            correct: "What was THE EVENT like?",
            catch:
              "🚨 **O CATCH:** A estrutura é sempre **What was + (it/the event) + like?**. Você não pode deixar sem esse 'it' ou um substantivo. Então: **What was the event like?** ou **What was it like?**",
          },
        ],
      },

      // 8) Eu moro no Brasil há 13 anos.
      {
        id: 8,
        bp: "Eu moro no Brasil há 13 anos.",
        title: "Ação que Continua: Morar no Brasil (PPC)",
        variations: {
          essential: "I have been living in Brazil for 13 years.",
          polite: "I have been residing in Brazil for 13 years.",
          native: "Been living in Brazil for 13 years now.",
        },
        steps: [
          {
            bp: "Eu moro há 13 anos",
            literal: "I live for 13 years.",
            correct: "I have been living for 13 years",
            catch:
              "🚨 **O CATCH:** Em português, 'Eu moro há 13 anos' usa presente. Em inglês, pra essa mesma ideia (começou no passado e continua), usamos **Present Perfect Continuous**: **I have been living...**. **I live in Brazil for 13 years** soa errado, como se a ação tivesse um fim definido.",
          },
          {
            bp: "no Brasil há 13 anos",
            literal: "in Brazil since 13 years.",
            correct: "in Brazil for 13 years.",
            catch:
              "🚨 **O CATCH:** Regra de ouro: **for = duração** (for 13 years, for two weeks, for a long time); **since = ponto de início** (since 2010, since last year). 'Há 13 anos' = **for 13 years**.",
          },
          {
            bp: "Passado Simples (cenário 7)",
            literal: "I lived in Brazil for 13 years.",
            correct: "I lived in Brazil for 13 years. (Eu não moro mais lá.)",
            catch:
              "🚨 **O CATCH:** Se você **não mora mais** lá, use **Simple Past**: **I lived in Brazil for 13 years.** Se ainda mora, use **I have been living in Brazil for 13 years.** A pergunta chave é: a situação continua hoje?",
          },
        ],
      },

      // 9) Comecei a fazer algo (e continuo).
      {
        id: 9,
        bp: "Comecei a fazer algo (e continuo).",
        title: "Ação Progressiva em Andamento (Present Perfect Continuous)",
        variations: {
          essential: "I have been working on this project.",
          polite:
            "I have been dedicating my time to this project since its inception.",
          native: "Been working on this project.",
        },
        steps: [
          {
            bp: "Comecei a trabalhar",
            literal: "I started to work",
            correct: "I have been working",
            catch:
              "🚨 **O CATCH:** Se a ideia é 'comecei e ainda estou fazendo', o foco é na **duração/progresso**, não só no começo. A estrutura natural é **have been + -ing**: **I have been working.** 'I started to work' foca só no início, não no fato de estar no meio do processo.",
          },
          {
            bp: "em um projeto.",
            literal: "in a project.",
            correct: "on a project.",
            catch:
              "🚨 **O CATCH:** Em inglês, você **work on** a project, task, idea. Então: **work on a project**, não 'in a project'.",
          },
        ],
      },

      // 10) O que você tem feito no trabalho ultimamente?
      {
        id: 10,
        bp: "O que você tem feito no trabalho ultimamente?",
        title:
          "PPC: Ênfase na Duração e Atividade (Verbos de Trabalho)",
        variations: {
          essential: "I have been coordinating the new team.",
          polite:
            "I have been actively coordinating the new team and managing resources.",
          native: "I've been running the new team.",
        },
        steps: [
          {
            bp: "O que você tem feito?",
            literal: "What you have done?",
            correct: "What have you been doing lately?",
            catch:
              "🚨 **O CATCH:** Pergunta de **atividade contínua/repetida**: **What have you been doing lately?**. A ordem correta é auxiliar (have) + sujeito (you) + been + doing. 'What you have done?' soa como afirmação com ordem de pergunta e foca em resultado, não em processo.",
          },
          // Blocos 2 e 3 removidos conforme pedido
        ],
      },

      // 11) Eu tinha falado / Eu tenho falado.
      {
        id: 11,
        bp: "Eu tinha falado / Eu tenho falado.",
        title: "Passado Perfeito (Had) vs. Present Perfect (Have)",
        variations: {
          essential: "I have spoken / I had spoken.",
          polite: "I have communicated this / I had communicated this prior.",
          native: "I've said it / I'd already said it.",
        },
        steps: [
          {
            bp: "Eu tenho falado.",
            literal: "I am talking.",
            correct: "I have spoken.",
            catch:
              "🚨 **O CATCH:** **I have spoken** = ação terminada com efeito agora (já falei, então não preciso falar de novo) ou em tempo não específico. Não confunda com **I'm talking**, que é algo em andamento neste momento.",
          },
          {
            bp: "Eu tinha falado.",
            literal: "I had spoke.",
            correct: "I had spoken.",
            catch:
              "🚨 **O CATCH:** **Past Perfect** = passado do passado: **I had spoken to her before the meeting started.** Primeiro falei, depois a reunião começou. E cuidado: o particípio é **spoken**, não *spoke*.",
          },
          {
            bp: "Eu tenho falado (PPC)",
            literal: "I'm talking.",
            correct: "I have been speaking.",
            catch:
              "🚨 **O CATCH:** **I have been speaking** mostra ação repetida ou contínua num período: 'Tenho falado com ela sobre isso.' Destaca processo/duração, não só o fato de ter falado.",
          },
        ],
      },
    ];

    const VariationButton = ({
      label,
      selected,
      onClick,
      isDarkMode,
    }) => (
      <button
        onClick={onClick}
        className={
          "px-4 py-2 text-sm font-semibold rounded-full transition-all duration-200 " +
          (selected
            ? "bg-indigo-600 text-white shadow-lg shadow-indigo-500/50"
            : isDarkMode
            ? "bg-indigo-800/50 text-indigo-300 hover:bg-indigo-700/70"
            : "bg-indigo-100 text-indigo-700 hover:bg-indigo-200")
        }
      >
        {label}
      </button>
    );

    const App = () => {
      const [selectedLessonId, setSelectedLessonId] = useState(lessons[0].id);
      const [selectedVariation, setSelectedVariation] = useState("essential");
      const [darkMode, setDarkMode] = useState(true);

      const selectedLesson = lessons.find(
        (l) => l.id === selectedLessonId
      );

      const toggleDarkMode = () => setDarkMode((prev) => !prev);

      const bgColor = darkMode ? "bg-slate-900" : "bg-gray-50";
      const cardColor = darkMode ? "bg-slate-800" : "bg-white";
      const primaryTextColor = darkMode ? "text-gray-100" : "text-gray-900";
      const secondaryTextColor = darkMode ? "text-green-400" : "text-green-600";
      const cardShadow = darkMode
        ? "shadow-2xl shadow-slate-700/50"
        : "shadow-xl";
      const borderColor = darkMode ? "border-slate-700" : "border-indigo-100";

      if (!selectedLesson) {
        return (
          <div className="p-8 text-center text-red-500">
            Lição não encontrada.
          </div>
        );
      }

      const renderContent = (content) => {
        if (
          typeof content === "string" &&
          content.includes('<ul class="verb-list')
        ) {
          return <div dangerouslySetInnerHTML={{ __html: content }} />;
        }
        return <p className="font-bold text-green-700 text-lg">{content}</p>;
      };

      // Decide quais variações mostrar
      const getVisibleVariations = (lessonId) => {
        // 1 e 5: só essencial
        if (lessonId === 1 || lessonId === 5) {
          return ["essential"];
        }
        // 7: essencial + polite
        if (lessonId === 7) {
          return ["essential", "polite"];
        }
        // demais: todas
        return ["essential", "polite", "native"];
      };

      const visibleVariations = getVisibleVariations(selectedLesson.id);

      // Se variação selecionada não existe nessa lição, voltar para essential
      React.useEffect(() => {
        if (!visibleVariations.includes(selectedVariation)) {
          setSelectedVariation("essential");
        }
      }, [selectedLessonId]);

      return (
        <div
          className={
            "min-h-screen font-sans p-4 sm:p-8 w-full " +
            bgColor +
            " " +
            primaryTextColor
          }
        >
          <header className="mb-8 text-center relative">
            <button
              onClick={toggleDarkMode}
              className={
                "absolute top-0 right-0 p-2 rounded-full transition-colors duration-300 " +
                (darkMode
                  ? "bg-indigo-600 text-white hover:bg-indigo-500"
                  : "bg-indigo-100 text-indigo-700 hover:bg-indigo-200")
              }
              aria-label="Toggle Dark Mode"
            >
              {darkMode ? (
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  className="h-6 w-6"
                  viewBox="0 0 20 20"
                  fill="currentColor"
                >
                  <path d="M17.293 13.513A10 10 0 0110 20V0c5.523 0 10 4.477 10 10 0 1.574-.36 3.064-1.026 4.398l-1.681-1.681zM10 18a8 8 0 100-16 8 8 0 000 16z" />
                </svg>
              ) : (
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  className="h-6 w-6"
                  viewBox="0 0 20 20"
                  fill="currentColor"
                >
                  <path
                    fillRule="evenodd"
                    d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.969 5.836a1 1 0 01-1.748 0L9.293 16a1 1 0 00-1.414 0l-.678.678a1 1 0 01-1.748 0 1 1 0 01-.168-.168l-3.232-3.232a1 1 0 011.414-1.414l3.232 3.232a1 1 0 001.414 0l.678-.678a1 1 0 011.748 0L14.707 16a1 1 0 01-1.414 1.414l-3.232-3.232a1 1 0 01-.168-.168z"
                    clipRule="evenodd"
                  />
                </svg>
              )}
            </button>

            <h1
              className={
                "text-3xl sm:text-4xl font-extrabold leading-tight " +
                primaryTextColor
              }
            >
              🤖 Daby: Inglês Lego para Brasileiros
            </h1>
            <p className={"mt-2 text-lg " + secondaryTextColor}>
              Foco: Dominando o <strong>Present Perfect</strong> e o{" "}
              <strong>Passado Contínuo</strong>!
              <br />
              <span className="font-bold text-xl text-red-500">
                Não importa se a ação terminou ou não terminou
              </span>
            </p>
          </header>

          <div className="flex flex-col lg:flex-row gap-8 max-w-7xl mx-auto">
            {/* Sidebar */}
            <div
              className={
                "lg:w-1/3 p-6 rounded-xl h-fit border " +
                cardColor +
                " " +
                cardShadow +
                " " +
                borderColor
              }
            >
              <h2 className={"text-xl font-bold mb-4 " + secondaryTextColor}>
                Selecione uma Frase (BP)
              </h2>
              <div className="space-y-2">
                {lessons.map((lesson) => (
                  <button
                    key={lesson.id}
                    onClick={() => {
                      setSelectedLessonId(lesson.id);
                      setSelectedVariation("essential");
                    }}
                    className={
                      "w-full text-left p-3 rounded-lg transition-all duration-200 font-medium " +
                      (lesson.id === selectedLessonId
                        ? "bg-indigo-500 text-white shadow-md"
                        : darkMode
                        ? "bg-slate-700 text-gray-300 hover:bg-slate-600"
                        : "bg-gray-100 text-gray-700 hover:bg-indigo-50 hover:text-indigo-600")
                    }
                  >
                    {lesson.bp}
                  </button>
                ))}
              </div>
            </div>

            {/* Main content */}
            <div className="lg:w-2/3 space-y-8">
              {/* Title card */}
              <div
                className={
                  "p-6 rounded-xl border-l-4 border-green-600 " +
                  cardColor +
                  " " +
                  cardShadow
                }
              >
                <p className="text-xl font-light text-gray-500 mb-1">
                  Frase Selecionada (Foco no Presente):
                </p>
                <h2
                  className={"text-3xl font-extrabold " + primaryTextColor}
                >
                  {selectedLesson.bp}
                </h2>
                <p className={"mt-2 font-semibold " + secondaryTextColor}>
                  {selectedLesson.title}
                </p>
              </div>

              {/* LEGO breakdown */}
              <div
                className={"p-6 rounded-xl " + cardColor + " " + cardShadow}
              >
                <h3
                  className={
                    "text-2xl font-bold mb-4 border-b pb-2 " +
                    primaryTextColor
                  }
                >
                  🧱 Método LEGO: Desmontando e Construindo
                </h3>
                <div className="space-y-6">
                  {selectedLesson.steps.map((step, index) => (
                    <div
                      key={index}
                      className={
                        "border p-4 rounded-lg " +
                        (darkMode
                          ? "border-slate-700 bg-slate-700/50"
                          : "border-gray-200 bg-green-50/50")
                      }
                    >
                      <p className="text-sm font-semibold text-gray-500 mb-2">
                        Bloco {index + 1}
                      </p>

                      <div className="grid grid-cols-3 gap-3 mb-3">
                        {/* PT block */}
                        <div className="text-center p-2 rounded-lg bg-pink-100 border border-pink-300">
                          <p className="font-bold text-pink-700 text-lg">
                            {step.bp}
                          </p>
                          <p className="text-xs text-pink-500">
                            PORTUGUÊS (BR)
                          </p>
                        </div>

                        {/* Literal block */}
                        <div className="text-center p-2 rounded-lg bg-red-100 border border-red-300">
                          <p className="font-bold text-red-700 text-lg">
                            {step.literal}
                          </p>
                          <p className="text-xs text-red-500">
                            Frase sem muita importância/relevância
                          </p>
                        </div>

                        {/* Correct block */}
                        <div className="text-center p-2 rounded-lg bg-green-100 border border-green-300">
                          {renderContent(step.correct)}
                          <p className="text-xs text-green-500">
                            BLOCO LEGO (CORRETO)
                          </p>
                        </div>
                      </div>

                      <div
                        className={
                          "mt-3 p-3 rounded-lg border " +
                          (darkMode
                            ? "bg-slate-700 border-green-600"
                            : "bg-white border-green-300")
                        }
                      >
                        <p className="font-extrabold text-green-500">
                          🚨 O CATCH / O ERRO ANTECIPADO:
                        </p>
                        <p
                          className={
                            "text-sm mt-1 " +
                            (darkMode ? "text-gray-200" : "text-gray-700")
                          }
                        >
                          {step.catch}
                        </p>
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              {/* Real-world variations */}
              <div
                className={"p-6 rounded-xl " + cardColor + " " + cardShadow}
              >
                <h3
                  className={
                    "text-2xl font-bold mb-4 border-b pb-2 " +
                    primaryTextColor
                  }
                >
                  🗣️ Versões para o Mundo Real
                </h3>
                <p
                  className={
                    "text-sm mb-4 " +
                    (darkMode ? "text-gray-300" : "text-gray-700")
                  }
                >
                  Professor aqui! Veja como a mesma ideia pode ser expressa de
                  formas diferentes, dependendo do contexto e da formalidade.
                </p>

                <div className="flex flex-wrap gap-3 mb-6">
                  {visibleVariations.includes("essential") && (
                    <VariationButton
                      label="BÁSICO/ESSENCIAL"
                      selected={selectedVariation === "essential"}
                      onClick={() => setSelectedVariation("essential")}
                      isDarkMode={darkMode}
                    />
                  )}
                  {visibleVariations.includes("polite") && (
                    <VariationButton
                      label="EDUCADO (Polite)"
                      selected={selectedVariation === "polite"}
                      onClick={() => setSelectedVariation("polite")}
                      isDarkMode={darkMode}
                    />
                  )}
                  {visibleVariations.includes("native") && (
                    <VariationButton
                      label="NATIVO (Native/Casual)"
                      selected={selectedVariation === "native"}
                      onClick={() => setSelectedVariation("native")}
                      isDarkMode={darkMode}
                    />
                  )}
                </div>

                <div
                  className={
                    "p-4 sm:p-6 rounded-lg border-l-4 " +
                    (darkMode
                      ? "bg-slate-700 border-green-500"
                      : "bg-green-50 border-green-500")
                  }
                >
                  <p
                    className={
                      "text-sm font-medium mb-1 " + secondaryTextColor
                    }
                  >
                    Versão Selecionada:{" "}
                    <span className="uppercase">{selectedVariation}</span>
                  </p>
                  <p
                    className={
                      "text-2xl font-extrabold break-words " +
                      primaryTextColor
                    }
                  >
                    {selectedLesson.variations[selectedVariation]}
                  </p>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
